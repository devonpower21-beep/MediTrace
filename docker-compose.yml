services:
  # 1. MongoDB - Data Store
  mongo:
    image: mongo:latest
    container_name: meditrace-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Redis - Caching/Queue
  redis:
    image: redis:alpine
    container_name: meditrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. ML Inference Engine (Lightweight - No Training)
  ml-inference:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: meditrace-ml-inference
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./ml-service:/app # Mount code for hot reload (app.py)
      - ./ml-service/artifacts:/app/artifacts # Mount pre-computed artifacts
    environment:
      - MONGO_URI=mongodb://mongo:27017/meditrace
      - FLASK_ENV=development
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 4. Local Blockchain (Hardhat Network) - Production-ready testing
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: meditrace-blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8545" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 5. Web Application
  web-app:
    build: ./web
    container_name: meditrace-web-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - ./web:/app
    environment:
      - NODE_PATH=/app/node_modules
      - MONGO_URI=mongodb://mongo:27017/meditrace
      - AUTH_SECRET=7f8a9b1c2d3e4f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v # Generated Secret
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - ML_SERVICE_URL=http://ml-inference:5000
      - BLOCKCHAIN_RPC_URL=http://blockchain:8545
      - BLOCKCHAIN_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - NEXT_PUBLIC_BLOCKCHAIN_URL=http://localhost:8545
    command: pnpm dev
    depends_on:
      mongo:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # 6. One-shot DB Seeder — runs once, seeds demo users, then exits
  seeder:
    image: python:3.11-slim
    container_name: meditrace-seeder
    restart: "no" # Run once only
    volumes:
      - ./scripts:/scripts
    environment:
      - SEED_BASE_URL=http://web-app:3000/api
    command: >
      sh -c "pip install requests --quiet && python /scripts/seed_users.py"
    depends_on:
      web-app:
        condition: service_healthy

volumes:
  mongo_data:
